<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Portfolio with Accessible Images – HTML & CSS course assignment">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ankit Kaur – Portfolio</title>
</head>
<body>

  <header>
    <h1>Ankit Kaur – Portfolio</h1>
  </header>

  <main>

    <section>
      <h2>Profile</h2>
      <img src="profile.jpg" width="150" height="150"
           alt="Portrait of Ankit Kaur with long dark hair, wearing a pink outfit">
      <p>Hello! My name is Ankit Kaur. I am a BCA student learning HTML, CSS and web development.</p>
    </section>

    <section>
      <h2>Projects</h2>

      <figure>
        <img src="https://picsum.photos/id/180/400/250"
             width="400" height="250"
             alt="Screenshot of a resume website showing a name header and skills list">
        <figcaption>Resume Website</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/119/400/250"
             width="400" height="250"
             alt="Screenshot of a student registration form with name, email and course fields">
        <figcaption>Registration Form</figcaption>
      </figure>
    </section>

    <section>
      <h2>Decorative Image</h2>
      <img src="https://picsum.photos/id/1015/600/80"
           width="600" height="80" alt="">
    </section>

    <section>
      <h2>Linked Image</h2>
      <a href="https://github.com/">
        <img src="https://picsum.photos/id/60/120/120"
             width="60" height="60"
             alt="Visit my GitHub profile">
      </a>
    </section>

  </main>

  <!-- ALT TEXT CHECKLIST
       Describe meaningful images.
       Don't start with "image of".
       Linked images describe their destination.
       Decorative images use alt="".
  -->

</body>
</html>
