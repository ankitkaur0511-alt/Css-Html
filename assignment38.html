<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple dashboard for tracking shop performance.">
  <title>grid-dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f2f5f4;
      color: #26352f;
    }

    .dashboard {
      display: grid;
      min-height: 100vh;
      grid-template-columns: 210px repeat(3, 1fr);
      grid-template-rows: 64px auto 1fr 48px;
      grid-template-areas:
        "header header header header"
        "sidebar sales orders customers"
        "sidebar chart chart updates"
        "footer footer footer footer";
      gap: 16px;
      padding: 16px;
    }

    .dashboard > * {
      padding: 16px;
      background: white;
      border-radius: 10px;
    }

    .header {
      grid-area: header;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      background: #174d3e;
    }

    .sidebar {
      grid-area: sidebar;
      color: white;
      background: #236b53;
    }

    .sidebar ul {
      padding: 0;
      list-style: none;
    }

    .sidebar li {
      padding: 12px 0;
      border-bottom: 1px solid #ffffff40;
    }

    .sales { grid-area: sales; }
    .orders { grid-area: orders; }
    .customers { grid-area: customers; }
    .chart { grid-area: chart; }
    .updates { grid-area: updates; }
    .footer { grid-area: footer; text-align: center; }

    .stat strong {
      display: block;
      margin-top: 8px;
      color: #236b53;
      font-size: 1.8rem;
    }

    .bars {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      height: 160px;
      margin-top: 20px;
    }

    .bars span {
      flex: 1;
      border-radius: 5px 5px 0 0;
      background: #65b891;
    }

    .updates li {
      margin: 12px 0;
    }

    @media (max-width: 800px) {
      .dashboard {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "header header"
          "sales orders"
          "customers customers"
          "chart chart"
          "updates updates"
          "sidebar sidebar"
          "footer footer";
      }
    }
  </style>
</head>

<body>
  <main class="dashboard">
    <header class="header">
      <strong>Market Overview</strong>
      <span>Welcome, Sam</span>
    </header>

    <aside class="sidebar">
      <ul>
        <li>🏠 Home</li>
        <li>🛍️ Products</li>
        <li>📦 Orders</li>
        <li>⚙️ Settings</li>
      </ul>
    </aside>

    <section class="stat sales">
      <span>Sales this month</span>
      <strong>₹3.8L</strong>
    </section>

    <section class="stat orders">
      <span>New orders</span>
      <strong>716</strong>
    </section>

    <section class="stat customers">
      <span>Customers</span>
      <strong>2,305</strong>
    </section>

    <section class="chart">
      <h2>Weekly Sales</h2>
      <div class="bars" aria-hidden="true">
        <span style="height: 45%"></span>
        <span style="height: 70%"></span>
        <span style="height: 55%"></span>
        <span style="height: 85%"></span>
        <span style="height: 65%"></span>
        <span style="height: 95%"></span>
        <span style="height: 75%"></span>
      </div>
    </section>

    <section class="updates">
      <h2>Latest Updates</h2>
      <ul>
        <li>Order #716 received</li>
        <li>New customer joined</li>
        <li>Product stock updated</li>
      </ul>
    </section>

    <footer class="footer">© 2026 Market Dashboard</footer>
  </main>
</body>
</html>
