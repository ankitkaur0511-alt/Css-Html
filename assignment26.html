<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Box Model</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.5;
      margin: 20px;
    }

    .box {
      width: 200px;
      padding: 20px;
      border: 10px solid steelblue;
      margin: 30px;
      background: lightblue;
      text-align: center;
    }

    table {
      border-collapse: collapse;
    }

    th,
    td {
      padding: 8px;
      border: 1px solid gray;
      text-align: left;
    }
  </style>
</head>

<body>
  <h1>CSS Box Model</h1>
  <p>Each element is made of content, padding, border, and margin.</p>

  <div class="box">Content</div>

  <h2>Box size</h2>
  <table>
    <tr>
      <th>Part</th>
      <th>Size</th>
    </tr>
    <tr>
      <td>Content width</td>
      <td>200px</td>
    </tr>
    <tr>
      <td>Padding</td>
      <td>20px on each side</td>
    </tr>
    <tr>
      <td>Border</td>
      <td>10px on each side</td>
    </tr>
    <tr>
      <td>Total width</td>
      <td>260px, not including margin</td>
    </tr>
  </table>
</body>
</html>
