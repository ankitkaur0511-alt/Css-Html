<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GizmoHub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f8;
    }

    header {
      padding: 16px 32px;
      background: #222;
      color: white;
    }

    .products {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      max-width: 1100px;
      margin: auto;
      padding: 24px;
    }

    .product {
      flex: 1 1 220px;
      max-width: 280px;
      padding: 16px;
      background: white;
      border-radius: 10px;
    }

    .product img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 6px;
    }

    .price {
      font-weight: bold;
    }

    button {
      padding: 8px 16px;
      border: 0;
      border-radius: 5px;
      background: #ff6b35;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <header>
    <h1>GizmoHub</h1>
  </header>

  <main class="products">
    <article class="product">
      <img src="https://picsum.photos/id/1/400/300" alt="Laptop">
      <h2>Everyday Laptop</h2>
      <p>Light and fast for work or study.</p>
      <span class="price">₹52,999</span>
      <button>Add</button>
    </article>

    <article class="product">
      <img src="https://picsum.photos/id/3/400/300" alt="Keyboard">
      <h2>Wireless Keyboard</h2>
      <p>Comfortable typing, anywhere.</p>
      <span class="price">₹2,499</span>
      <button>Add</button>
    </article>

    <article class="product">
      <img src="https://picsum.photos/id/26/400/300" alt="Smart watch">
      <h2>Fit Smartwatch</h2>
      <p>Track your daily activity.</p>
      <span class="price">₹3,799</span>
      <button>Add</button>
    </article>

    <article class="product">
      <img src="https://picsum.photos/id/96/400/300" alt="Headphones">
      <h2>Studio Headphones</h2>
      <p>Clear sound with a 20-hour battery.</p>
      <span class="price">₹1,999</span>
      <button>Add</button>
    </article>
  </main>
</body>
</html>
