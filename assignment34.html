<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Northstar cloud platform for building and running modern apps.">
  <title>Northstar — Ship what's next</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      color: #f5f7f2;
      background: #101b2d;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 6%;
      border-bottom: 1px solid #29364a;
    }

    .logo {
      color: #c7f36b;
      font-size: 1.4rem;
      font-weight: 800;
    }

    .links {
      display: flex;
      align-items: center;
      gap: 1.75rem;
      list-style: none;
    }

    .links a {
      color: #d5dce7;
      text-decoration: none;
    }

    .links .cta {
      padding: 0.7rem 1rem;
      color: #101b2d;
      background: #c7f36b;
      border-radius: 6px;
      font-weight: 700;
    }

    #toggle,
    .burger {
      display: none;
    }

    .hero {
      display: flex;
      align-items: center;
      gap: 3rem;
      max-width: 1200px;
      min-height: 75vh;
      margin: auto;
      padding: 4rem 2rem;
    }

    .hero__text,
    .hero__img {
      flex: 1;
    }

    .eyebrow {
      margin-bottom: 1rem;
      color: #c7f36b;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 600px;
      margin-bottom: 1.25rem;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      line-height: 1.05;
    }

    .hero__text p {
      max-width: 460px;
      margin-bottom: 2rem;
      color: #b5c0cf;
      line-height: 1.7;
    }

    .hero__btns {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .btn {
      display: inline-block;
      padding: 0.85rem 1.25rem;
      border: 1px solid #c7f36b;
      border-radius: 6px;
      color: #101b2d;
      background: #c7f36b;
      font-weight: 700;
      text-decoration: none;
    }

    .btn--outline {
      color: #f5f7f2;
      background: transparent;
    }

    .hero__img img {
      display: block;
      width: 100%;
      border: 1px solid #344258;
      border-radius: 18px;
    }

    @media (max-width: 700px) {
      .burger {
        display: block;
        color: #f5f7f2;
        font-size: 1.8rem;
        cursor: pointer;
      }

      .links {
        position: absolute;
        top: 68px;
        right: 0;
        left: 0;
        display: none;
        align-items: stretch;
        flex-direction: column;
        padding: 1.25rem 6%;
        background: #101b2d;
      }

      #toggle:checked ~ .links {
        display: flex;
      }

      .hero {
        flex-direction: column-reverse;
        min-height: auto;
        padding: 2.5rem 1.25rem;
        text-align: center;
      }

      .hero__text p {
        margin-right: auto;
        margin-left: auto;
      }

      .hero__btns {
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <span class="logo">northstar</span>

    <input type="checkbox" id="toggle">
    <label for="toggle" class="burger" aria-label="Open navigation">☰</label>

    <ul class="links">
      <li><a href="#">Platform</a></li>
      <li><a href="#">Solutions</a></li>
      <li><a href="#">Resources</a></li>
      <li><a class="cta" href="#">Try it free</a></li>
    </ul>
  </nav>

  <main class="hero">
    <section class="hero__text">
      <div class="eyebrow">Your next idea starts here</div>
      <h1>Go from first commit to launch day.</h1>
      <p>
        Build, release, and grow your apps on one simple platform.
        Northstar handles the infrastructure while you focus on the work.
      </p>

      <div class="hero__btns">
        <a class="btn" href="#">Create your account</a>
        <a class="btn btn--outline" href="#">Explore the platform</a>
      </div>
    </section>

    <div class="hero__img">
      <img
        src="https://picsum.photos/id/180/700/500"
        alt="Workspace with a laptop ready for development">
    </div>
  </main>
</body>
</html>
