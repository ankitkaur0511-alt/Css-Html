<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A profile card and a dress product card.">
  <title>Ankit Kaur's Profile</title>

  <style>
    :root {
      --purple: #5b4bdb;
      --round: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 32px;
      min-height: 100vh;
      margin: 0;
      padding: 48px 16px;
      background: #eef0f8;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 300px;
      overflow: hidden;
      border-radius: var(--round);
      background: white;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
    }

    .profile {
      text-align: center;
    }

    .cover {
      height: 100px;
      background: linear-gradient(120deg, var(--purple), #00b4d8);
    }

    .profile-photo {
      width: 100px;
      height: 100px;
      margin-top: -50px;
      border: 5px solid white;
      border-radius: 50%;
      object-fit: cover;
    }

    .card-content {
      padding: 20px;
    }

    .profile h2 {
      margin: 8px 0 0;
    }

    .profile p {
      margin: 4px 0 16px;
      color: #666;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 16px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }

    .stats strong,
    .stats span {
      display: block;
    }

    .stats span {
      color: #888;
      font-size: 13px;
    }

    .button {
      display: block;
      padding: 10px 16px;
      border-radius: 10px;
      background: var(--purple);
      color: white;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
    }

    .button:hover {
      background: #3f31b0;
    }

    .product {
      position: relative;
    }

    .dress-photo {
      display: block;
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .label {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      background: #e63946;
      color: white;
      font-size: 13px;
      font-weight: bold;
    }

    .product h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .rating {
      color: #f4a100;
    }

    .price {
      margin: 12px 0;
    }

    .price strong {
      font-size: 24px;
    }
  </style>
</head>

<body>
  <article class="card profile">
    <div class="cover"></div>

    <img
      class="profile-photo"
      src="https://images.unsplash.com/photo-1695964714581-511346975560?auto=format&fit=crop&w=300&h=300&q=80"
      alt="Woman with long dark hair standing with her back to the camera">

    <div class="card-content">
      <h2>Ankit Kaur</h2>
      <p>Student at Invertis University, Bareilly</p>

      <div class="stats">
        <div><strong>12</strong><span>Projects</span></div>
        <div><strong>250</strong><span>Followers</span></div>
        <div><strong>80</strong><span>Posts</span></div>
      </div>

      <a class="button" href="#">Follow</a>
    </div>
  </article>

  <article class="card product">
    <span class="label">New</span>

    <img
      class="dress-photo"
      src="https://images.unsplash.com/photo-1735553816867-88cd8496df58?auto=format&fit=crop&w=600&h=400&q=80"
      alt="Pink floral dress displayed on a mannequin">

    <div class="card-content">
      <h2>Floral Summer Dress</h2>
      <div class="rating" aria-label="4 out of 5 stars">★★★★☆ <small>(120)</small></div>
      <div class="price"><strong>₹499</strong></div>
      <a class="button" href="#">Shop now</a>
    </div>
  </article>
</body>
</html>
