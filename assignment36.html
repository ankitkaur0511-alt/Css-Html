<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Gallery</title>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #26352f;
      background: #f3f1eb;
    }

    h1 {
      text-align: center;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 1000px;
      margin: 24px auto;
    }

    figure {
      position: relative;
      height: 220px;
      margin: 0;
      overflow: hidden;
      border-radius: 10px;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    figcaption {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 10px;
      color: white;
      background: #0009;
    }

    @media (max-width: 650px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 420px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <h1>Wander Frames</h1>

  <main class="gallery">
    <figure>
      <img src="https://picsum.photos/id/1015/600/400" alt="River between green hills">
      <figcaption>Quiet waters</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1016/600/400" alt="Rocky canyon landscape">
      <figcaption>Open country</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1018/600/400" alt="Mountain in the mist">
      <figcaption>Morning mist</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1019/600/400" alt="Wooden dock beside a lake">
      <figcaption>By the lake</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1036/600/400" alt="Snowy trees in a forest">
      <figcaption>Winter trail</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/id/1039/600/400" alt="Waterfall among green plants">
      <figcaption>Hidden falls</figcaption>
    </figure>
  </main>
</body>
</html>
